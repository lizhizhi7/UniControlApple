name: Swift

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

    - name: Show Swift version
      run: swift --version

    - name: Clean
      run: swift package clean

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v
      continue-on-error: true  # Remove this line once tests are added
